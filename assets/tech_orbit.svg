<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" height="100%" style="background: #080c14; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <radialGradient id="atomCoreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <pattern id="orbitGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
    </pattern>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.6)" />
    </filter>
  </defs>

  <style>
    @keyframes orbit1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterOrbit1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes orbit2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes counterOrbit2 {
      0% { transform: rotate(-360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes orbit3 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterOrbit3 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulseCoreAnim {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 0.7; }
    }

    @keyframes chipShimmerAnim {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .orbit-plane-1 { transform-origin: 450px 165px; animation: orbit1 20s linear infinite; }
    .orbit-plane-2 { transform-origin: 450px 165px; animation: orbit2 26s linear infinite; }
    .orbit-plane-3 { transform-origin: 450px 165px; animation: orbit3 22s linear infinite; }

    .counter-icon-1 { animation: counterOrbit1 20s linear infinite; }
    .counter-icon-2 { animation: counterOrbit2 26s linear infinite; }
    .counter-icon-3 { animation: counterOrbit3 22s linear infinite; }

    .core-pulse { transform-origin: 450px 165px; animation: pulseCoreAnim 3s ease-in-out infinite; }
    .shimmer-pass { animation: chipShimmerAnim 4s infinite linear; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="490" rx="16" fill="url(#orbitBg)" />
  <rect width="900" height="490" rx="16" fill="url(#orbitGrid)" />
  <rect width="900" height="490" rx="16" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(30, 20)">
    <text fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700" letter-spacing="1.5">TECH STACK // ORBITAL RADAR</text>
    <text y="20" fill="#f8fafc" font-size="16" font-weight="800">Core Technologies &amp; Architecture Matrix</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(710, 25)">
    <rect width="160" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" />
    <text x="22" y="16" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="700">3D ATOM CORE ONLINE</text>
  </g>

  <!-- ==================== ORBITAL SYSTEM ==================== -->
  
  <!-- Orbit 1 Track (Tilted -25 deg) -->
  <ellipse cx="450" cy="165" rx="205" ry="65" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-dasharray="5 5" transform="rotate(-25 450 165)" />

  <!-- Orbit 2 Track (Tilted +28 deg) -->
  <ellipse cx="450" cy="165" rx="235" ry="78" fill="none" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5" stroke-dasharray="5 5" transform="rotate(28 450 165)" />

  <!-- Orbit 3 Track (Tilted +82 deg) -->
  <ellipse cx="450" cy="165" rx="215" ry="70" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5" stroke-dasharray="5 5" transform="rotate(82 450 165)" />

  <!-- Central Atom Core -->
  <g class="core-pulse">
    <!-- Outer energy corona -->
    <circle cx="450" cy="165" r="42" fill="#38bdf8" opacity="0.18" filter="url(#coreGlow)" />
    <!-- Nucleus Sphere -->
    <circle cx="450" cy="165" r="26" fill="url(#atomCoreGrad)" filter="url(#coreGlow)" />
    <!-- Inner swirl -->
    <circle cx="450" cy="165" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8" />
    <!-- Center Glyph -->
    <text x="450" y="172" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">⚛</text>
  </g>

  <!-- ==================== ORBIT 1 CARRIER (React, TypeScript, Vite) ==================== -->
  <g transform="rotate(-25 450 165)">
    <g class="orbit-plane-1">
      
      <!-- Icon 1: React 19 (x=655, y=165) -->
      <g transform="translate(655, 165)">
        <g class="counter-icon-1" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#61dafb" stroke-width="2" filter="url(#iconShadow)" />
          <!-- React Atom Symbol -->
          <ellipse cx="0" cy="0" rx="12" ry="4.5" fill="none" stroke="#61dafb" stroke-width="1.2" />
          <ellipse cx="0" cy="0" rx="12" ry="4.5" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(60)" />
          <ellipse cx="0" cy="0" rx="12" ry="4.5" fill="none" stroke="#61dafb" stroke-width="1.2" transform="rotate(120)" />
          <circle cx="0" cy="0" r="2.5" fill="#61dafb" />
        </g>
      </g>

      <!-- Icon 2: TypeScript (x=245, y=165) -->
      <g transform="translate(245, 165)">
        <g class="counter-icon-1" style="transform-origin: 0px 0px;">
          <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#3178c6" stroke="#60a5fa" stroke-width="1.5" filter="url(#iconShadow)" />
          <text x="0" y="6" fill="#ffffff" font-size="16" font-family="monospace" font-weight="900" text-anchor="middle">TS</text>
        </g>
      </g>

      <!-- Icon 3: Vite (x=450, y=100) -->
      <g transform="translate(450, 100)">
        <g class="counter-icon-1" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.8" filter="url(#iconShadow)" />
          <path d="M -5 -9 L 3 -9 L -1 -1 L 5 -1 L -4 9 L -1 1 L -5 1 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.8" />
        </g>
      </g>

    </g>
  </g>

  <!-- ==================== ORBIT 2 CARRIER (Tailwind, Node.js, Express) ==================== -->
  <g transform="rotate(28 450 165)">
    <g class="orbit-plane-2">
      
      <!-- Icon 4: Tailwind CSS (x=685, y=165) -->
      <g transform="translate(685, 165)">
        <g class="counter-icon-2" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#iconShadow)" />
          <!-- Tailwind Wind Waves -->
          <path d="M -9 2 C -9 -2, -5 -4, -2 -4 C 1 -4, 2 -2, 4 -2 C 6 -2, 7 -3, 8 -4 M -10 6 C -8 3, -4 2, 0 2 C 4 2, 6 4, 9 4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
        </g>
      </g>

      <!-- Icon 5: Node.js (x=215, y=165) -->
      <g transform="translate(215, 165)">
        <g class="counter-icon-2" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="19" fill="#052e16" stroke="#22c55e" stroke-width="2" filter="url(#iconShadow)" />
          <!-- Hexagon Node -->
          <path d="M 0 -10 L 9 -5 L 9 5 L 0 10 L -9 5 L -9 -5 Z" fill="#15803d" stroke="#4ade80" stroke-width="1" />
          <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle">JS</text>
        </g>
      </g>

      <!-- Icon 6: Express (x=450, y=87) -->
      <g transform="translate(450, 87)">
        <g class="counter-icon-2" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" filter="url(#iconShadow)" />
          <text x="0" y="4" fill="#f8fafc" font-size="10" font-family="monospace" font-weight="900" text-anchor="middle">EX</text>
        </g>
      </g>

    </g>
  </g>

  <!-- ==================== ORBIT 3 CARRIER (Firebase, Linux, Gemini AI) ==================== -->
  <g transform="rotate(82 450 165)">
    <g class="orbit-plane-3">
      
      <!-- Icon 7: Firebase (x=665, y=165) -->
      <g transform="translate(665, 165)">
        <g class="counter-icon-3" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="19" fill="#451a03" stroke="#f59e0b" stroke-width="2" filter="url(#iconShadow)" />
          <!-- Flame Symbol -->
          <path d="M -4 9 L 4 9 L 6 3 L 1 -9 L -3 0 L -6 4 Z" fill="#fbbf24" />
          <path d="M -1 9 L 4 9 L 6 3 L 1 -9 Z" fill="#f59e0b" />
        </g>
      </g>

      <!-- Icon 8: Linux / Kali (x=235, y=165) -->
      <g transform="translate(235, 165)">
        <g class="counter-icon-3" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="19" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#iconShadow)" />
          <text x="0" y="5" font-size="16" text-anchor="middle">🐧</text>
        </g>
      </g>

      <!-- Icon 9: Google Gemini AI (x=450, y=95) -->
      <g transform="translate(450, 95)">
        <g class="counter-icon-3" style="transform-origin: 0px 0px;">
          <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.8" filter="url(#iconShadow)" />
          <!-- 4-pointed sparkle -->
          <path d="M 0 -9 Q 0 0, -9 0 Q 0 0, 0 9 Q 0 0, 9 0 Q 0 0, 0 -9 Z" fill="#60a5fa" />
        </g>
      </g>

    </g>
  </g>

  <!-- ==================== LOWER CHIP GRID ==================== -->
  <g transform="translate(25, 310)">
    <!-- Container Box -->
    <rect width="850" height="155" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />

    <!-- Category 1: Frontend -->
    <g transform="translate(20, 16)">
      <text fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">🌐 FRONTEND &amp; UI:</text>
      <!-- Chips -->
      <g transform="translate(130, -12)">
        <!-- React 19 -->
        <rect x="0" y="0" width="84" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="42" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">React 19</text>
        <!-- TypeScript -->
        <rect x="92" y="0" width="94" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="139" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
        <!-- Tailwind v4 -->
        <rect x="194" y="0" width="98" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="243" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Tailwind v4</text>
        <!-- Vite -->
        <rect x="300" y="0" width="60" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="330" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Vite</text>
        <!-- Framer Motion -->
        <rect x="368" y="0" width="112" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="424" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Framer Motion</text>
        <!-- Recharts -->
        <rect x="488" y="0" width="82" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="529" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Recharts</text>
        <!-- JS ES6+ -->
        <rect x="578" y="0" width="102" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
        <text x="629" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">JavaScript ES6+</text>
      </g>
    </g>

    <!-- Category 2: Backend & AI -->
    <g transform="translate(20, 62)">
      <text fill="#a855f7" font-size="11" font-weight="700" letter-spacing="1">⚙️ BACKEND &amp; AI:</text>
      <!-- Chips -->
      <g transform="translate(130, -12)">
        <!-- Node.js -->
        <rect x="0" y="0" width="76" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
        <text x="38" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Node.js</text>
        <!-- Express -->
        <rect x="84" y="0" width="80" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
        <text x="124" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Express</text>
        <!-- Firebase -->
        <rect x="172" y="0" width="138" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
        <text x="241" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Firebase Realtime DB</text>
        <!-- Gemini AI -->
        <rect x="318" y="0" width="128" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
        <text x="382" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Google Gemini AI</text>
        <!-- REST APIs -->
        <rect x="454" y="0" width="94" height="26" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
        <text x="501" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">REST APIs</text>
      </g>
    </g>

    <!-- Category 3: Tools & Security -->
    <g transform="translate(20, 108)">
      <text fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="1">🛡️ TOOLS &amp; OPS:</text>
      <!-- Chips -->
      <g transform="translate(130, -12)">
        <!-- Linux Kali -->
        <rect x="0" y="0" width="132" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
        <text x="66" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Linux (Kali/Ubuntu)</text>
        <!-- Git & GitHub -->
        <rect x="140" y="0" width="102" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
        <text x="191" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Git &amp; GitHub</text>
        <!-- Postman -->
        <rect x="250" y="0" width="80" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
        <text x="290" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Postman</text>
        <!-- POS Billing Systems -->
        <rect x="338" y="0" width="144" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
        <text x="410" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Retail POS Hardware</text>
        <!-- UPI Dynamic QR -->
        <rect x="490" y="0" width="136" height="26" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1" />
        <text x="558" y="17" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Dynamic UPI QR Rails</text>
      </g>
    </g>
  </g>
</svg>